name: SOLVEX checks
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: solvex_test
          POSTGRES_PASSWORD: solvex_test
          POSTGRES_DB: solvex_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
        env:
          SOLVEX_TEST_DATABASE_URL: postgres://solvex_test:solvex_test@localhost:5432/solvex_test
      - run: npm audit --omit=dev --audit-level=high
